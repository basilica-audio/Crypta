# release.yml — tag-triggered signed release build.
# Reconciled with the suite-wide template at
# ~/Development/Audio/.scaffold/release-workflow-template.yml (CMake target: Crypta).
#
# Security model:
#   - Triggered only by tags pushed to this repo (never by fork PRs; secrets are
#     unavailable to pull_request events from forks by GitHub design).
#   - Signing cert lives in org-level encrypted secrets, imported into a throwaway
#     keychain that is deleted in the job's post step.
#   - Minimal permissions: contents:write only (to attach release assets).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub release for this tag (idempotent)
        # Both release-macos and release-windows upload assets via
        # `gh release upload`, which requires the release object to already
        # exist for the tag - neither job created it, so both failed with
        # "release not found" on a fresh tag push. `gh release view` first
        # makes re-runs (e.g. after a transient build failure) idempotent
        # instead of erroring on an already-created release.
        #
        # Release notes come from the CHANGELOG section matching the tag
        # (issue #30's "changelog section extraction"): the awk block prints
        # everything between `## [x.y.z]` and the next `## [` heading. A tag
        # without a CHANGELOG section - v0.3.1 shipped that way - falls back
        # to --generate-notes rather than publishing an empty body.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - leaving its notes untouched."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
            }
            found
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "Using CHANGELOG section for $VERSION ($(wc -l < notes.md) lines)."
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::No CHANGELOG section for $VERSION - falling back to generated notes."
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release-macos:
    name: Signed macOS release
    needs: create-release
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set CPM source cache path
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"

      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure & build (Release, universal)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --target Crypta_AU Crypta_VST3 Crypta_Standalone --parallel 3

      - name: Import signing certificates (throwaway keychain)
        # The Developer ID *Installer* certificate, when it exists, is imported
        # here rather than in the .pkg step: this is the only place the
        # throwaway keychain's password is in scope, so it never has to be
        # written to GITHUB_ENV for a later step to re-use.
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC=$RUNNER_TEMP/release.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          if [ -n "${INSTALLER_CERT_P12:-}" ]; then
            echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
            rm "$RUNNER_TEMP/installer.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, package
        timeout-minutes: 40
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARTEFACT_ROOT="build/Crypta_artefacts"
          # JUCE's artefact path may or may not include a Release/ segment
          # depending on whether the generator is single- or multi-config
          # (this build uses single-config Ninja); see the equivalent
          # find-based lookup in ci.yml's "Locate plugin artefacts" step.
          find_artefact_dir() {
            local pattern="$1"
            local path
            path=$(find "$ARTEFACT_ROOT" -type d -iname "$pattern" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::No $pattern artefact found under $ARTEFACT_ROOT"
              exit 1
            fi
            dirname "$path"
          }
          COMPONENT_DIR=$(find_artefact_dir "*.component")
          VST3_DIR=$(find_artefact_dir "*.vst3")
          STANDALONE_DIR=$(find_artefact_dir "*.app")
          mkdir -p stage/AU stage/VST3 stage/Standalone
          cp -R "$COMPONENT_DIR/"*.component stage/AU/
          cp -R "$VST3_DIR/"*.vst3 stage/VST3/
          cp -R "$STANDALONE_DIR/"*.app stage/Standalone/
          for B in stage/AU/*.component stage/VST3/*.vst3 stage/Standalone/*.app; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$B"
            codesign --verify --strict "$B"
          done
          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --norsrc --noextattr --noqtn --noacl stage notarize-me.zip
          xcrun notarytool submit notarize-me.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          for B in stage/AU/*.component stage/VST3/*.vst3 stage/Standalone/*.app; do
            xcrun stapler staple "$B"
          done
          # Issue #31: assert all three gates (codesign --verify --strict,
          # spctl --assess, stapler validate) rather than trusting that a
          # zero exit from staple alone means the artefact is Gatekeeper-clean.
          .github/scripts/verify-macos-signing.sh stage/AU/*.component stage/VST3/*.vst3 stage/Standalone/*.app
          SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ditto -c -k --norsrc --noextattr --noqtn --noacl stage "$SLUG-$GITHUB_REF_NAME-macos.zip"
          echo "ASSET=$SLUG-$GITHUB_REF_NAME-macos.zip" >> "$GITHUB_ENV"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Build signed .pkg installer
        timeout-minutes: 40
        # Issue #31. The bundles in stage/ are already signed, notarized and
        # stapled by the previous step; this wraps them in a distribution
        # installer that drops each format in its canonical location.
        #
        # A .pkg is only worth shipping if it is signed with a **Developer ID
        # Installer** certificate: notarytool refuses an unsigned .pkg, and an
        # un-notarized installer is blocked by Gatekeeper - strictly worse for
        # users than the plain zip. That certificate is a separate Apple
        # certificate type from the Developer ID *Application* cert this repo
        # already has, so the step no-ops (with a notice, not a failure) until
        # the secret exists. Adding APPLE_INSTALLER_CERT_P12 +
        # APPLE_INSTALLER_CERT_PASSWORD at org level is the only manual step
        # left; everything below is ready for it.
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::notice::No 'Developer ID Installer' identity in the keychain - skipping the .pkg installer (see issue #31). The signed/notarized zip is unaffected."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkgroot/au pkgroot/vst3 pkgroot/app pkgcomp pkgout
          cp -R stage/AU/*.component pkgroot/au/
          cp -R stage/VST3/*.vst3 pkgroot/vst3/
          cp -R stage/Standalone/*.app pkgroot/app/

          # BundleIsRelocatable is switched off on every component: all three
          # JUCE bundles carry the same CFBundleIdentifier, so a relocatable
          # install would happily drop the AU on top of whatever copy Spotlight
          # finds first instead of the canonical plug-in folder.
          build_component () {
            local name="$1" root="$2" dest="$3" ident="$4"
            pkgbuild --analyze --root "$root" "pkgcomp/$name.plist"
            /usr/libexec/PlistBuddy -c "Add :0:BundleIsRelocatable bool false" "pkgcomp/$name.plist" \
              || /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "pkgcomp/$name.plist"
            pkgbuild --root "$root" --component-plist "pkgcomp/$name.plist" \
              --identifier "$ident" --version "$VERSION" \
              --install-location "$dest" "pkgcomp/$name.pkg"
          }
          build_component au   pkgroot/au   "/Library/Audio/Plug-Ins/Components" "com.yvesvogl.crypta.au"
          build_component vst3 pkgroot/vst3 "/Library/Audio/Plug-Ins/VST3"       "com.yvesvogl.crypta.vst3"
          build_component app  pkgroot/app  "/Applications"                      "com.yvesvogl.crypta.standalone"

          cat > pkgcomp/distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>Crypta $VERSION</title>
              <options customize="always" require-scripts="false" hostArchitectures="arm64,x86_64"/>
              <domains enable_localSystem="true" enable_currentUserHome="false" enable_anywhere="false"/>
              <choices-outline>
                  <line choice="au"/>
                  <line choice="vst3"/>
                  <line choice="app"/>
              </choices-outline>
              <choice id="au" title="Audio Unit (AU)" description="Installs Crypta.component into /Library/Audio/Plug-Ins/Components."><pkg-ref id="com.yvesvogl.crypta.au"/></choice>
              <choice id="vst3" title="VST3" description="Installs Crypta.vst3 into /Library/Audio/Plug-Ins/VST3."><pkg-ref id="com.yvesvogl.crypta.vst3"/></choice>
              <choice id="app" title="Standalone app" description="Installs Crypta.app into /Applications."><pkg-ref id="com.yvesvogl.crypta.standalone"/></choice>
              <pkg-ref id="com.yvesvogl.crypta.au" version="$VERSION">au.pkg</pkg-ref>
              <pkg-ref id="com.yvesvogl.crypta.vst3" version="$VERSION">vst3.pkg</pkg-ref>
              <pkg-ref id="com.yvesvogl.crypta.standalone" version="$VERSION">app.pkg</pkg-ref>
          </installer-gui-script>
          XML

          PKG="$SLUG-$GITHUB_REF_NAME-macos.pkg"
          productbuild --distribution pkgcomp/distribution.xml --package-path pkgcomp "pkgout/unsigned.pkg"
          productsign --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN" "pkgout/unsigned.pkg" "$PKG"
          pkgutil --check-signature "$PKG"

          # AuthKey.p8 is still on disk from the signing step; the
          # "Delete throwaway keychain" post step removes it.
          xcrun notarytool submit "$PKG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$PKG"
          # Issue #31: same three-gate assertion as the bundles above
          # (pkgutil --check-signature in place of codesign for a .pkg,
          # since it is a flat installer archive rather than Mach-O code).
          .github/scripts/verify-macos-signing.sh "$PKG"
          echo "PKG_ASSET=$PKG" >> "$GITHUB_ENV"

      - name: Delete throwaway keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$KEYCHAIN" || true

      - name: Attach to release
        run: |
          set -euo pipefail
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"
          if [ -n "${PKG_ASSET:-}" ]; then
            shasum -a 256 "$PKG_ASSET" > "$PKG_ASSET.sha256"
            gh release upload "$GITHUB_REF_NAME" "$PKG_ASSET" "$PKG_ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release-windows:
    name: Windows release (unsigned)
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set CPM source cache path
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure & build (Release)
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target Crypta_VST3 Crypta_Standalone --parallel 3
      - name: Package & attach
        shell: bash
        run: |
          set -euo pipefail
          ARTEFACT_ROOT="build/Crypta_artefacts"
          # JUCE's artefact path may or may not include a Release/ segment
          # depending on whether the generator is single- or multi-config;
          # see the equivalent find-based lookup in ci.yml's "Locate plugin
          # artefacts" step.
          find_artefact_dir() {
            local type_flag="$1" pattern="$2"
            local path
            path=$(find "$ARTEFACT_ROOT" -type "$type_flag" -iname "$pattern" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::No $pattern artefact found under $ARTEFACT_ROOT"
              exit 1
            fi
            dirname "$path"
          }
          VST3_DIR=$(find_artefact_dir d "*.vst3")
          STANDALONE_DIR=$(find_artefact_dir f "*.exe")
          mkdir -p stage/VST3 stage/Standalone
          cp -R "$VST3_DIR/"*.vst3 stage/VST3/
          cp "$STANDALONE_DIR/"*.exe stage/Standalone/
          SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ASSET="$SLUG-$GITHUB_REF_NAME-windows.zip"
          cd stage && 7z a "../$ASSET" . && cd ..
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
